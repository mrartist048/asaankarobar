<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Manager</title>
<style>
:root{--bg:#E2E8F0;--card:#FFFFFF;--ink:#333333;--mut:#64748B;--line:#D3DBE7;--pri:#14B8A6;--pri2:#0F9A8A;--acc:#14B8A6;--bad:#c0392b;--side:#333333;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262626;--card:#333333;--ink:#E2E8F0;--mut:#94A3B8;--line:#4A4F57;--pri:#14B8A6;--pri2:#0F9A8A;--side:#1f1f1f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,Roboto,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:200px;background:var(--side);color:#E2E8F0;padding:18px 12px;flex-shrink:0}
nav h1{font-size:17px;margin:0 8px 18px;color:#fff}nav small{display:block;color:var(--acc);font-weight:400;font-size:12px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button.on,nav button:hover{background:rgba(255,255,255,.1);color:#fff}
main{flex:1;padding:22px;min-width:0;max-width:1100px}
h2{margin:0 0 16px;font-size:22px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.g .c{margin:0}.c b.n{display:block;font-size:22px}.c span.l{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
td.r,th.r{text-align:right}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--pri);outline-offset:1px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:10px}
.btn{background:var(--pri);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.s{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.d{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row>*{flex:1;min-width:120px}.row>.btn{flex:0 0 auto}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.pi{display:flex;justify-content:space-between;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.pi:hover{border-color:var(--pri)}.pi.sel{border-color:var(--pri);background:rgba(20,184,166,.1);box-shadow:0 0 0 2px rgba(20,184,166,.18)}.pi small{color:var(--mut)}
.low{color:var(--bad);font-weight:600}.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.b{font-size:19px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;overflow:auto;padding:20px;z-index:9}
#ov.on{display:block}.bar{max-width:760px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}
.inv{background:#fff;color:#111;max-width:760px;margin:0 auto;padding:36px;font-size:14px;border-radius:6px}
.inv h1{margin:0;font-size:26px;color:#333333}.inv .hd{display:flex;justify-content:space-between;border-bottom:3px solid #14B8A6;padding-bottom:14px;margin-bottom:16px}
.inv table th{background:#E2E8F0;color:#111}.inv td,.inv th{border-bottom:1px solid #ddd;white-space:normal}
.inv .sum{margin-left:auto;width:260px;margin-top:14px}.inv .ft{text-align:center;margin-top:34px;color:#555;border-top:1px dashed #aaa;padding-top:12px}
.paid{display:inline-block;border:2px solid #14B8A6;color:#14B8A6;padding:2px 10px;font-weight:700;border-radius:4px}.due{border-color:#c0392b;color:#c0392b}
#login{position:fixed;inset:0;background:var(--side);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#login.on{display:flex}.lc{background:var(--card);padding:28px;border-radius:14px;width:min(360px,100%)}.lc h1{margin:0 0 4px;font-size:22px}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav button{width:auto;white-space:nowrap}main{padding:14px}.two{grid-template-columns:1fr}}
@media print{body{background:#fff}.app,.bar{display:none!important}#ov{position:static;background:none;padding:0;display:block}.inv{max-width:none;padding:0;border-radius:0}@page{margin:14mm}}

body{background:radial-gradient(1100px 480px at 95% -10%,rgba(20,184,166,.12),transparent),var(--bg);font-family:Inter,"Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
nav{background:linear-gradient(180deg,#333333,#2b2b2b);width:224px;box-shadow:4px 0 28px rgba(0,0,0,.1)}
nav button{border-radius:10px;transition:background .2s}nav button.on{background:linear-gradient(90deg,rgba(20,184,166,.22),rgba(255,255,255,.05));box-shadow:inset 3px 0 var(--acc)}
.c{border-radius:16px;box-shadow:var(--sh);border-color:transparent;padding:18px}
.btn{background:linear-gradient(135deg,var(--pri),#0F9A8A);border-radius:10px;box-shadow:0 6px 14px -6px rgba(20,184,166,.6);transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn.s,.btn.d{background:none;box-shadow:none}
input,select{border-radius:10px;padding:10px 12px;transition:box-shadow .2s,border-color .2s}input:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(20,184,166,.16);outline:0}
#login{background:radial-gradient(circle at 15% 10%,rgba(20,184,166,.35),transparent 50%),radial-gradient(circle at 90% 95%,rgba(20,184,166,.2),transparent 45%),#333333;overflow:auto}
.lc{border-radius:24px;padding:34px 30px;box-shadow:0 30px 80px -20px rgba(0,0,0,.65);animation:up .5s}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.logo{display:block;text-align:center;margin:0 auto 8px}.logo img{width:170px;max-width:70%;height:auto;display:inline-block}
#fx{position:fixed;inset:0;background:rgba(51,51,51,.55);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50}#fx.on{display:grid}
.fxb{background:var(--card);border-radius:24px;padding:30px 38px;text-align:center;min-width:290px;box-shadow:0 30px 80px -20px #000a;animation:up .3s}.fxb h3{margin:12px 0 4px}.fxb p{margin:0;color:var(--mut)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--pri);margin:auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tick{width:68px;height:68px}.tick circle,.tick path{fill:none;stroke:var(--pri);stroke-linecap:round;stroke-linejoin:round}.tick circle{stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s forwards}.tick path{stroke-width:4;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pb{height:8px;background:var(--line);border-radius:9px;margin-top:16px;overflow:hidden;display:none}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .3s}
pre.code{background:#333333;color:#bff3e4;border-radius:12px;padding:14px;max-height:280px;overflow:auto;font-size:12px}
ol.st{padding-left:20px;color:var(--mut)}ol.st li{margin-bottom:6px}.ok{color:var(--pri);font-weight:600;font-size:13px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--pri);cursor:pointer}
.nbrand{display:flex;align-items:center;gap:11px;margin:2px 6px 20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}.nbrand h1{margin:0!important;font-size:16px;line-height:1.25;min-width:0;overflow-wrap:anywhere}.nlogo{flex:0 0 auto;width:48px;height:48px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}.nlogo i{display:block;width:42px;height:42px;background:var(--logo) center/contain no-repeat}@media(max-width:760px){.nbrand{margin:0 10px 0 2px;padding:0;border:0;flex:0 0 auto}.nlogo{width:38px;height:38px;border-radius:10px}.nlogo i{width:33px;height:33px}}#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(900px 500px at 50% 0,rgba(20,184,166,.14),transparent),#E2E8F0;transition:opacity .4s}#boot.off{opacity:0;pointer-events:none}#boot img{width:190px;max-width:55vw;height:auto}#boot .ring{width:42px;height:42px;border-radius:50%;border:4px solid rgba(100,116,139,.25);border-top-color:#14B8A6;animation:sp .8s linear infinite}#boot p{margin:0;color:#64748B;font-size:13px;letter-spacing:.3px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #boot{background:#262626}#boot img{background:#fff;border-radius:22px;padding:8px}}

<dialog id="pd"><h3 style="margin-top:0" id="pt">Product</h3>
<label>Product name<input id="p_n"></label>
<div class="row"><label>Code / SKU<input id="p_s"></label><label>Category<input id="p_c"></label></div>

<div class="row" style="justify-content:flex-end"><button class="btn s" onclick="pd.close()">Cancel</button><button class="btn" onclick="saveP()">Save product</button></div></dialog>
<script>
const $=s=>document.querySelector(s),ov=$('#ov'),pd=$('#pd');
let DB=null;
DB=DB||{shop:{name:'My Shop',addr:'Shop address, City',phone:'03XX-XXXXXXX',cur:'Rs.',tax:0,foot:'Thank you for shopping with us!'},products:[],sales:[],users:[]};DB.users=DB.users||[];
const save=()=>{};
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>DB.shop.cur+' '+(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const dt=d=>new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
let V='dash',cart=[],editId=null;
const tabs=[['dash','📊 Dashboard'],['sale','🧾 New Sale'],['prod','📦 Stock'],['hist','🗂 Sales'],['udh','💰 Udhaar'],['set','⚙ Settings']];
function go(v){V=v;$('#nav').innerHTML=`<div class="nbrand"><div class="nlogo"><i></i></div><h1>${e(DB.shop.name)}<small>Sales & Stock</small></h1></div>`+tabs.filter(t=>me.role=='owner'||t[0]!='set').map(t=>`<button class="${t[0]==v?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+`<button onclick="logout()">⎋ Log out (${e(me.name)})</button>`;({dash,sale,prod,hist,udh,set})[v]()}
function dash(){const td=new Date().toDateString(),S=DB.sales,ts=S.filter(s=>new Date(s.date).toDateString()==td),sv=DB.products.reduce((a,p)=>a+p.cost*p.qty,0),low=DB.products.filter(p=>p.qty<=p.min),
profit=S.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.price-i.cost)*i.qty,0)-s.disc,0);
$('#main').innerHTML=`<h2>Dashboard</h2><div class="g"><div class="c"><span class="l">Today's sales</span><b class="n">${m(ts.reduce((a,s)=>a+s.total,0))}</b><span class="l">${ts.length} invoices</span></div>
<div class="c"><span class="l">Total sales</span><b class="n">${m(S.reduce((a,s)=>a+s.total,0))}</b></div>
${me.role=='owner'?`<div class="c"><span class="l">Estimated profit</span><b class="n">${m(profit)}</b></div>`:''}

async function loadU(){try{DB.users=(await gas({a:'staffList'})).users;$('#upn').innerHTML=upan()}catch(x){if(x.code=='bad'||x.code=='key')$('#upn').innerHTML='<div class="c"><b>Staff logins</b><p style="color:var(--mut)">Update your Apps Script code (Configure GS &gt; Show Apps Script code, then Deploy a New version) to add staff.</p></div>'}}
async function addU(){const n=$('#nn').value.trim(),u=un($('#nu').value),p=$('#np').value;if(!n||!okU(u))return alert('Enter a name and a username (3-20 letters, numbers, _ or -).');if(p.length<6)return alert('Password must be at least 6 characters.');
try{await gas({a:'addStaff',su:u,pw:p,name:n});await loadU();fx('ok','Staff added',n+' can now log in')}catch(x){alert(x.code=='username'?'This username is already taken.':x.code=='bad'?'Update your Apps Script code first (Configure GS > Show Apps Script code).':x.message)}}
function rmU(id){if(confirm('Remove this login? They will lose access to the shop.'))gas({a:'rmStaff',su:id}).then(loadU).catch(x=>alert(x.message))}

rrent-password'}" ${m}>${r?`<input id="lp2" type="password" placeholder="Confirm password" autocomplete="new-password" ${m}>`:''}<button class="btn" style="width:100%;margin-top:14px;padding:12px" onclick="${r?'doReg()':'doAuth()'}">${r?'Register':'Log in'}</button><p id="le" class="low"></p>${r?'<small style="color:var(--mut)">Write your password down. It cannot be recovered if you forget it.</small>':''}<p style="text-align:center;margin:6px 0">${r?'Already registered? '+a('in','Sign in'):st?'Shop owner? '+a('in','Owner login'):'New shop? '+a('reg','<b>Register here</b>')+' &nbsp;·&nbsp; '+a('staff','Staff login')}</p></div>`;$('#login').onkeydown=ev=>{if(ev.key=='Enter')(mode=='reg'?doReg:doAuth)()};$('#login').classList.add('on')}
async function doReg(){const sn=$('#rs').value.trim(),n=$('#rn').value.trim(),u=un($('#lu').value),p=$('#lp').value;if(!sn||!n)return msg('Enter the shop name and the owner name.');if(!okU(u))return msg('Username: 3-20 letters, numbers, _ or -.');if(p.length<6)return msg('Password must be at least 6 characters.');if(p!=$('#lp2').value)return msg('The two passwords do not match.');msg('Please wait…');
try{await post(AUTH,{a:'register',u,pw:p,name:n,shop:sn});const d=await post(AUTH,{a:'login',u,pw:p});await enter(d,u);if(me)saveLoc(u,p,d)}catch(x){if(x.code=='inactive')return pendingUI(PS[x.status]||0);msg(x.code=='username'?'This username is already taken.':x.message)}}

function pendingUI(k){const T=k==4?['Package expired','Your package has expired, so this shop and its staff cannot log in. Please contact the administrator to renew your package.']:k==3?['Account removed','This shop account has been removed by the administrator. Your data is safe and will be restored as soon as your subscription is renewed.']:k==2?['Account suspended','Your account is not active. Please contact the administrator.']:['Waiting for approval',k==0?'Thank you for registering! Your account will be activated once the administrator authorizes it.':'Your account has not been authorized yet. Please contact the administrator to activate it.'];$('#login').innerHTML=`<div class="lc"><h1>${T[0]}</h1><p style="color:var(--mut)">${T[1]}</p><p><b>${e(ADMIN_CONTACT)}</b></p><button class="btn" style="width:100%" onclick="authUI('in')">Back to sign in</button></div>`;$('#login').classList.add('on')}
const sha=async t=>btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode(t)))));
async function saveLoc(lk,p,d){try{const q=rnd(12);localStorage.setItem('shoploc_'+lk,JSON.stringify({s:q,h:await sha(q+p),d}))}catch(x){}}
async function locLogin(lk,p){try{const o=JSON.parse(localStorage.getItem('shoploc_'+lk));if(o&&o.h==await sha(o.s+p)&&localStorage.getItem('shopdb_'+lk)){let pf;try{pf=JSON.parse(localStorage.getItem('shopprof'))}catch(x){}return pf&&pf.t==o.d.t?pf:o.d}}catch(x){}return null}
function upd(p){try{for(const k of['shopprof','shoploc_'+me.lk]){const o=JSON.parse(localStorage.getItem(k));if(!o)continue;Object.assign(k=='shopprof'?o:o.d,p);localStorage.setItem(k,JSON.stringify(o))}}catch(x){}}
async function doAuth(){const st=mode=='staff',u=un($('#lu').value),p=$('#lp').value,o=st?un($('#ls').value):'';if(!u||!p||(st&&!o))return msg('Please fill in all the fields.');const lk=st?o+'/'+u:u;msg('Please wait…');
const lc=await locLogin(lk,p);if(lc){enter(lc,lk,1);return}
try{let d;if(st){const sh=await post(AUTH,{a:'shop',o}),l=await post(sh.url,{a:'slogin',u,pw:p});d={t:l.t,name:l.name,role:'staff',url:sh.url,key:'',shop:sh.shop,exp:sh.exp,owner:o}}else d=await post(AUTH,{a:'login',u,pw:p});await enter(d,lk);if(me)saveLoc(lk,p,d)}
catch(x){if(x.code=='inactive')return pendingUI(PS[x.status]||1);msg(x.code=='bad'?'Wrong username or password.'+(st?' Check the Shop ID too.':''):x.message)}}
const PS={pending:1,suspended:2,removed:3,expired:4};
async function verify(d,lk){try{if(d.role=='staff'){const r=await post(AUTH,{a:'shop',o:d.owner});SU=r.url;d.exp=r.exp;if(me)me.exp=r.exp;await gas({a:'ping'})}else{const r=await post(AUTH,{a:'session',u:lk,t:d.t});SU=r.url||'';SK=r.key||'';Object.assign(d,r);if(me)me.exp=r.exp||0}localStorage.setItem('shopprof',JSON.stringify(d))}catch(x){if(x.net)return;if(x.code=='key'){alert('Your staff access was removed.');logout();return}if(fatal(x))return;if(/Session expired/.test(x.message))logout()}}
function tick(){if(me&&me.exp&&Date.now()>me.exp){alert('Your package has expired. Please contact the administrator.');logout();return}pull()}
async function enter(d,lk,fast){if(d.exp&&Date.now()>d.exp)return pendingUI(4);tok=d.t;me={id:d.role=='staff'?lk.split('/').pop():lk,lk,name:d.name,role:d.role,exp:d.exp||0,owner:d.owner};SU=d.url||'';SK=d.key||'';DB.shop.name=d.shop||DB.shop.name;
if(!SU&&me.role!='owner'){me=null;tok=null;return msg('Your shop owner has not connected the Google Sheet yet.')}
try{localStorage.setItem('shopme',JSON.stringify([lk,d.t]));localStorage.setItem('shopprof',JSON.stringify(d))}catch(x){}$('#login').classList.remove('on');clearInterval(timer);clearInterval(vt);loadOut();
if(SU){let c;try{c=JSON.parse(localStorage.getItem('shopdb_'+lk))}catch(x){}
if(c&&c.products){apply(c);runOut();gas({a:'load'}).then(r=>{if(!OUT.length&&!running){apply(r);refresh()}}).catch(x=>fatal(x))}else{go('dash');syncBar('Loading your data…');try{apply(await gas({a:'load'}))}catch(x){if(!fatal(x))alert('Could not reach your Google Sheet: '+x.message)}syncBar()}}
go(SU?'dash':'set');badge();timer=setInterval(tick,15000);vt=setInterval(()=>{if(navigator.onLine&&me)verify(d,lk)},600000);if(fast)verify(d,lk)}
function logout(){try{localStorage.removeItem('shopme')}catch(x){}clearInterval(timer);clearInterval(vt);syncBar();OUT=[];me=null;tok=null;SU=SK="";DB.products=[];DB.sales=[];DB.users=[];authUI()}
(async()=>{try{const[u,t]=JSON.parse(localStorage.getItem('shopme'));if(u&&t){let pf;try{pf=JSON.parse(localStorage.getItem('shopprof'))}catch(x){}if(pf&&pf.url&&pf.t==t&&localStorage.getItem('shopdb_'+u)){enter(pf,u,1);return}try{await enter(await post(AUTH,{a:'session',u,t}),u);if(me)return}catch(x){if(x.code=='inactive')return pendingUI(PS[x.status]||1)}}}catch(x){}authUI()})();
addEventListener('online',()=>{badge();runOut();setTimeout(()=>pull(true).catch(()=>{}),1500)});addEventListener('offline',badge);

document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
(function(){const b=$('#boot');if(!b)return;let d=0;const t0=Date.now();const hide=()=>{if(d)return;d=1;mo.disconnect();setTimeout(()=>{b.classList.add('off');setTimeout(()=>b.remove(),500)},Math.max(0,900-(Date.now()-t0)))};const chk=()=>{const sb=$('#sb'),ld=sb&&sb.style.display=='block'&&/Loading/.test(sb.textContent);if($('#login').classList.contains('on')||($('#nav').children.length&&!ld))hide()};const mo=new MutationObserver(chk);mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});setTimeout(hide,15000);chk()})();
</script></body></html>
